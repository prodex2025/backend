databaseChangeLog:
  - changeSet:
      id: V4.1__store_schedule
      author: aki
      preConditions:
        - sqlCheck:
            expectedResult: 1
            sql: "SELECT 1 FROM pg_available_extensions WHERE name = 'uuid-ossp'"
      changes:
        - createTable:
            tableName: store_schedule
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "uuid_generate_v4()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: day_of_week
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: is_closed
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: lunch_start
                  type: time
              - column:
                  name: lunch_end
                  type: time
              - column:
                  name: is_lunch_closed
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: dinner_start
                  type: Time
              - column:
                  name: dinner_end
                  type: Time
              - column:
                  name: is_dinner_closed
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: store_schedule
            baseColumnNames: restaurant_id
            referencedTableName: restaurants
            referencedColumnNames: id
            constraintName: fk_store_schedule_restaurant
            onDelete: CASCADE
