databaseChangeLog:
  - changeSet:
      id: V1.5__restaurants_closed_days_create_table
      author: aki
      preConditions:
        - sqlCheck:
            expectedResult: 1
            sql: "SELECT 1 FROM pg_available_extensions WHERE name = 'uuid-ossp'"
      changes:
        - createTable:
            tableName: restaurants_closed_days
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "uuid_generate_v4()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: day_of_week
                  type: smallint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: restaurants_closed_days
            baseColumnNames: restaurant_id
            referencedTableName: restaurants
            referencedColumnNames: id
            constraintName: fk_restaurant_closed_days
